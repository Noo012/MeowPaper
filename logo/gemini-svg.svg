<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="330 150 340 340" width="1000" height="1000">
  <defs>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#b5179e"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- توهج ناعم خفيف يبرز الألوان دون طمس الحروف -->
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- 1. إطار القطة -->
    <path d="
      M 370, 240 L 395, 175 L 440, 215 L 560, 215 L 605, 175 L 630, 240
      L 645, 240 Q 655, 240 655, 250 L 655, 345 Q 655, 355 645, 355
      L 355, 355 Q 345, 355 345, 345 L 345, 250 Q 345, 240 355, 240 Z" 
      fill="none" 
      stroke="url(#g3)" 
      stroke-width="7" 
      stroke-linejoin="round"
      stroke-linecap="round"
      filter="url(#f1)"/>

    <!-- 2. قاعدة الشاشة -->
    <path d="M 460, 368 L 540, 368 M 470, 380 L 530, 380" 
          stroke="url(#g3)" 
          stroke-width="5" 
          stroke-linecap="round"
          filter="url(#f1)"/>

    <!-- 3. حروف MP (بدون فلتر ضبابي لضمان أقصى حِدّة) -->
    <g stroke="url(#g3)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M 375, 325 L 375, 250 L 415, 325 L 455, 250 L 455, 325"/>
      <path d="M 500, 325 L 500, 250 L 580, 250 C 625, 250 625, 290 580, 290 L 500, 290"/>
    </g>

    <!-- 4. نص MeowPaper أبحادي الحِدّة -->
    <text x="500" y="465" 
          font-family="'Orbitron', 'Rajdhani', 'Segoe UI', sans-serif" 
          font-size="50" 
          font-weight="900" 
          letter-spacing="3"
          text-anchor="middle" 
          fill="url(#g3)">
      MeowPaper
    </text>
  </g>
</svg>
